<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coș de Cumpărături – Laborator 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">
<nav>
    <ul>
        <li><a href="index.html">🏠 Acasă</a></li>
        <li><a href="preferences.html">⚙️ Preferințe</a></li>
        <li><a href="cookies-info.html">🍪 Cookies Info</a></li>
        <li><a href="dashboard.html">📊 Dashboard</a></li>
    </ul>
</nav>
<div class="container">
    <div class="page-header">
        <h1>🛒 Coș de Cumpărături</h1>
        <div class="subtitle">Coșul este salvat în sessionStorage</div>
    </div>

    <div id="alertSuccess" class="alert-success"></div>

    <div class="section">
        <div class="section-title">📦 Adaugă produs</div>
        <div class="card" style="max-width:420px">
            <div class="form-group">
                <label for="productSelect">Produs</label>
                <select id="productSelect">
                    <option value="laptop">Laptop – 2500 RON</option>
                    <option value="telefon">Telefon – 1200 RON</option>
                    <option value="tableta">Tabletă – 800 RON</option>
                    <option value="casti">Căști – 150 RON</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Cantitate (1–10)</label>
                <input type="number" id="quantity" value="1" min="1" max="10">
            </div>
            <button class="btn btn-primary" onclick="addToCart()">➕ Adaugă în coș</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🛒 Produse în coș</div>
        <table>
            <thead>
                <tr><th>Produs</th><th>Preț unitar</th><th>Cantitate</th><th>Subtotal</th><th>Acțiune</th></tr>
            </thead>
            <tbody id="cartBody">
                <tr class="empty-row"><td colspan="5">Coșul este gol.</td></tr>
            </tbody>
        </table>
        <div class="cart-total" id="cartTotal"></div>
        <div style="margin-top:1rem;display:flex;gap:1rem">
            <a href="dashboard.html" class="btn btn-outline">← Înapoi la dashboard</a>
            <button class="btn btn-danger" onclick="clearCart()" style="padding:0.65rem 1.4rem;font-size:0.82rem">🗑️ Golește coșul</button>
        </div>
    </div>
</div>
<script src="js/cookies.js"></script>
<script src="js/storage.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
