<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare – Laborator 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">
<nav>
    <ul>
        <li><a href="index.html">🏠 Acasă</a></li>
        <li><a href="preferences.html">⚙️ Preferințe</a></li>
        <li><a href="cookies-info.html">🍪 Cookies Info</a></li>
        <li><a href="login.html" class="active">🔐 Autentificare</a></li>
    </ul>
</nav>
<div class="container">
    <div class="page-header">
        <h1>Autentificare</h1>
        <div class="subtitle">Introduceți credențialele pentru a accesa dashboard-ul</div>
    </div>

    <div id="alertError" class="alert-error"></div>
    <div id="alertSuccess" class="alert-success"></div>

    <div class="card" style="max-width:420px">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="ex: admin">
        </div>
        <div class="form-group">
            <label for="password">Parolă</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Ține-mă minte</label>
            </div>
        </div>
        <div style="display:flex;gap:1rem;margin-top:1.5rem">
            <button class="btn btn-primary" onclick="doLogin()">🔐 Intră în cont</button>
            <a href="register.html" class="btn btn-outline">Înregistrare →</a>
        </div>
    </div>

    <div style="margin-top:1.5rem;font-family:var(--mono);font-size:0.82rem;color:var(--text2)">
        Conturi de test: <strong>admin</strong> / password &nbsp;|&nbsp; <strong>student</strong> / student123
    </div>
</div>
<script src="js/cookies.js"></script>
<script src="js/storage.js"></script>
<script src="js/login.js"></script>
</body>
</html>
