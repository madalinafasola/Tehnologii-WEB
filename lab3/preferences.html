<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferințe – Laborator 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">
<nav>
    <ul>
        <li><a href="index.html">🏠 Acasă</a></li>
        <li><a href="preferences.html" class="active">⚙️ Preferințe</a></li>
        <li><a href="cookies-info.html">🍪 Cookies Info</a></li>
        <li><a href="login.html">🔐 Autentificare</a></li>
    </ul>
</nav>
<div class="container">
    <div class="page-header">
        <h1>Preferințe</h1>
        <div class="subtitle">Setările sunt salvate în Cookies și localStorage</div>
    </div>

    <div id="alertSuccess" class="alert-success">✔ Preferințele au fost salvate! Redirecționare...</div>
    <div id="alertError" class="alert-error"></div>

    <div class="card" style="max-width:480px">
        <div class="form-group">
            <label for="username">Nume utilizator</label>
            <input type="text" id="username" placeholder="ex: Ion Popescu">
            <div style="font-size:0.78rem;color:var(--text2);margin-top:0.3rem;font-family:var(--mono)">Cookie: <code>username</code></div>
        </div>
        <div class="form-group">
            <label for="theme">Temă</label>
            <select id="theme">
                <option value="light">🌞 Luminos</option>
                <option value="dark">🌙 Întunecat</option>
            </select>
            <div style="font-size:0.78rem;color:var(--text2);margin-top:0.3rem;font-family:var(--mono)">Cookie: <code>theme</code></div>
        </div>
        <div class="form-group">
            <label for="language">Limbă</label>
            <select id="language">
                <option value="ro">🇷🇴 Română</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
            </select>
            <div style="font-size:0.78rem;color:var(--text2);margin-top:0.3rem;font-family:var(--mono)">localStorage: <code>language</code></div>
        </div>
        <div class="form-group">
            <label for="fontSize">Dimensiune font</label>
            <select id="fontSize">
                <option value="14">14px – Mic</option>
                <option value="16">16px – Normal</option>
                <option value="18">18px – Mare</option>
                <option value="20">20px – Foarte mare</option>
            </select>
            <div style="font-size:0.78rem;color:var(--text2);margin-top:0.3rem;font-family:var(--mono)">localStorage: <code>fontSize</code></div>
        </div>
        <div style="display:flex;gap:1rem;margin-top:1.5rem">
            <button class="btn btn-primary" onclick="savePreferences()">💾 Salvează</button>
            <a href="index.html" class="btn btn-outline">← Înapoi</a>
        </div>
    </div>
</div>
<script src="js/cookies.js"></script>
<script src="js/storage.js"></script>
<script src="js/preferences.js"></script>
</body>
</html>
